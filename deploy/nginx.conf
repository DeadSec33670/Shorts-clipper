# nginx для shorts-clipper.
# Положить в /etc/nginx/sites-available/shorts-clipper и сделать симлинк
# в sites-enabled. Заменить example.com на свой домен.
#
# Сертификат проще всего получить так:
#     sudo certbot --nginx -d example.com
# certbot сам допишет пути к сертификатам в этот файл.

# HTTP -> HTTPS. Открытым оставляем только путь для проверки certbot.
server {
    listen 80;
    listen [::]:80;
    server_name example.com;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Загрузка видео. Должно совпадать с CLIPPER_MAX_UPLOAD_GB, иначе nginx
    # оборвёт запрос раньше приложения и пользователь увидит невнятную 413.
    client_max_body_size 2g;
    client_body_timeout 600s;
    # Тело запроса пишем на диск, а не держим в памяти
    client_body_buffer_size 256k;

    # Не выдаём версию nginx
    server_tokens off;

    # Логи без тела запроса; при желании обезличить IP — см. DEPLOY.md
    access_log /var/log/nginx/shorts-clipper.access.log;
    error_log  /var/log/nginx/shorts-clipper.error.log warn;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Обработка видео идёт долго — не рвём соединение
        proxy_connect_timeout 60s;
        proxy_send_timeout    3600s;
        proxy_read_timeout    3600s;
    }

    # Лог обработки отдаётся потоком (Server-Sent Events).
    # Без отключения буферизации nginx копил бы ответ и пользователь
    # видел бы пустой экран до самого конца обработки.
    location /api/stream {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_buffering off;
        proxy_cache off;
        gzip off;                 # gzip тоже буферизует поток
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;
    }

    # Готовые клипы. X-Accel-Redirect можно подключить позже, когда файлы
    # переедут в S3 и появятся подписанные ссылки (см. AUDIT, Этап 3).
    location /clips/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host            $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }
}
